<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradeHub — Peer to Peer Trading</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="logo"><span class="logo-icon"><span class="material-symbols-outlined">swap_horiz</span></span><span class="logo-word">TradeHub</span></div>
    <button class="header-msg" data-nav="messages" aria-label="Messages"><span class="material-symbols-outlined">mail</span><span id="msgBadge" class="nav-badge hidden">0</span></button>
  </div>
</header>

<main id="app">
  <!-- HOME -->
  <section id="view-home" class="view active">
    <div id="homeContent"></div>
  </section>

  <!-- DISCOVER -->
  <section id="view-discover" class="view">
    <div id="categoryChips" class="chips"></div>
    <div class="radius-row"><span class="radius-label">Distance</span><div id="radiusChips" class="chips compact"></div></div>
    <div id="browseGrid" class="grid"></div>
    <p id="noResults" class="empty hidden">No items match these filters.</p>
  </section>

  <!-- ITEM DETAIL -->
  <section id="view-detail" class="view">
    <button class="back-btn" data-nav="discover"><span class="material-symbols-outlined icon-inline">arrow_back</span> Back to Discover</button>
    <div id="detailContent"></div>
  </section>

  <!-- ADD ITEM -->
  <section id="view-add" class="view">
    <h1 class="page-title">Add New Item</h1>
    <form id="addForm" class="card form-card">
      <div class="photo-upload">
        <div id="photoPreview" class="photo-preview hidden"><img id="photoPreviewImg" alt=""><button type="button" class="btn btn-ghost" id="photoRemove">Remove photo</button></div>
        <label class="btn btn-outline photo-btn" for="fPhoto"><span class="material-symbols-outlined icon-inline">add</span> Take a photo or choose one</label>
        <input id="fPhoto" type="file" accept="image/*" hidden>
        <p class="muted">Snap a pic of your item — a photo helps it trade faster.</p>
      </div>
      <label>Title *
        <input id="fTitle" type="text" placeholder="e.g., Vintage Camera" required>
      </label>
      <label>Description *
        <textarea id="fDesc" rows="3" placeholder="Describe your item in detail..." required></textarea>
      </label>
      <div class="form-row">
        <label>Category *
          <select id="fCategory" required>
            <option value="">Select a category</option>
            <option>Electronics</option><option>Music</option><option>Outdoor</option>
            <option>Collectibles</option><option>Fashion</option>
          </select>
        </label>
        <label>Condition *
          <select id="fCondition" required>
            <option value="">Select condition</option>
            <option>Like New</option><option>Good</option><option>Fair</option>
          </select>
        </label>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" data-nav="discover">Cancel</button>
        <button type="submit" class="btn btn-primary">Add Item</button>
      </div>
    </form>
  </section>

  <!-- TRADES -->
  <section id="view-trades" class="view">
    <h1 class="page-title">Trade Offers</h1>
    <div class="tabs">
      <button class="tab active" data-tab="received">Received (<span id="receivedCount">0</span>)</button>
      <button class="tab" data-tab="sent">Sent (<span id="sentCount">0</span>)</button>
    </div>
    <div id="offersList" class="offers"></div>
  </section>

  <!-- MESSAGES -->
  <section id="view-messages" class="view">
    <h1 class="page-title">Messages</h1>
    <div class="messages-layout">
      <div id="folderList" class="folder-list"></div>
      <div id="conversationList" class="convo-list"></div>
      <div id="threadView" class="thread">
        <p class="empty">Select a conversation to start messaging.</p>
      </div>
    </div>
  </section>

  <!-- PROFILE -->
  <section id="view-profile" class="view">
    <div id="profileContent"></div>
  </section>
</main>

<!-- TRADE PROPOSAL MODAL — two-sided, RuneScape-style -->
<div id="tradeModal" class="modal hidden">
  <div class="modal-card trade-window">
    <h2>Propose a Trade</h2>
    <div class="trade-panes">
      <div class="trade-pane"><div class="side-label">You want</div><div id="tradeTargetCard"></div></div>
      <div class="trade-divider"><span class="material-symbols-outlined">swap_horiz</span></div>
      <div class="trade-pane"><div class="side-label">You offer</div><div id="myItemsPicker" class="picker"></div></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-ghost" id="tradeCancel">Cancel</button>
      <button class="btn btn-primary" id="tradeConfirm">Propose Trade</button>
    </div>
  </div>
</div>

<!-- TRADE WINDOW MODAL — two-sided offer with dual confirmation -->
<div id="tradeWindow" class="modal hidden">
  <div class="modal-card trade-window" id="tradeWindowContent"></div>
</div>

<div id="toast" class="toast hidden"></div>

<nav class="bottomnav">
  <button class="nav-btn active" data-nav="home"><span class="material-symbols-outlined nav-icon">home</span><span>Home</span></button>
  <button class="nav-btn" data-nav="discover"><span class="material-symbols-outlined nav-icon">search</span><span>Discover</span></button>
  <button class="nav-btn nav-center" data-nav="add"><span class="nav-center-icon"><span class="material-symbols-outlined">add</span></span><span>List Item</span></button>
  <button class="nav-btn" data-nav="trades"><span class="material-symbols-outlined nav-icon">swap_horiz</span><span>Trades</span></button>
  <button class="nav-btn" data-nav="profile"><span class="material-symbols-outlined nav-icon">person</span><span>Profile</span></button>
</nav>

<script src="app.js"></script>
</body>
</html>
